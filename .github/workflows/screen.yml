name: quarterly-halal-screening
# 18:00 Brisbane on 1 Jan/Apr/Jul/Oct = 08:00 UTC
on:
  schedule:
    - cron: "0 8 1 1,4,7,10 *"
  workflow_dispatch:
concurrency: { group: engine-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HALAL_TERMINAL_API_KEY: ${{ secrets.HALAL_TERMINAL_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ci/sync_data.sh restore
      - run: python main.py screen
      - run: ci/sync_data.sh save
